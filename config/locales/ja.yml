      place: 遊び場
    attributes:
      user:
        name: 名前
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
      place:
        name: 遊び場名
        description: 説明
        address: 住所
        category: カテゴリ
        indoor_outdoor: 屋内/屋外
        min_age: 対象年齢（下限）
        max_age: 対象年齢（上限）
        price: 料金
        business_hours: 営業時間
        cover_image: トップ画像
